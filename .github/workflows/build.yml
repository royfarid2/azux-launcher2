name: Build Azux

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 0) Unit test of the GLFW shim (fast, host only)
      - name: Test GLFW shim
        id: shimtest
        continue-on-error: true
        run: sh tools/tests/run.sh

      # 1a) Are the Java archives really in the checkout? (GitHub's web upload drops files > 25 MB)
      - name: List Java archives in the checkout
        run: |
          ls -la app/src/main/assets/runtime/ || true
          for n in 8 17 21 25; do
            f=app/src/main/assets/runtime/jre$n.tar.gz
            if [ -s "$f" ]; then echo "OK   jre$n.tar.gz $(du -h $f | cut -f1)"; else echo "::warning::jre$n.tar.gz is MISSING from the repository - the APK will download it from the 'runtime' release instead"; fi
          done

      # 1) Java runtimes (8, 17, 21, 25) are in the repository: check that they are intact
      - name: Verify Java runtimes
        id: runtime
        continue-on-error: true
        run: python3 tools/verify_runtime.py

      # 2) Native libraries with the NDK that is preinstalled on the runner:
      #    libazuxengine.so (our engine), LWJGL natives, gl4es, OpenAL
      - name: Build native libraries
        id: natives
        continue-on-error: true
        run: bash tools/build_natives.sh 2>&1 | tee natives.log

      # 3) The app itself (plain Java, no NDK needed)
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: What is inside the APK
        if: always()
        run: |
          echo "GLFW shim test  : ${{ steps.shimtest.outcome }}"
          echo "Java runtimes   : ${{ steps.runtime.outcome }}"
          echo "Native libs     : ${{ steps.natives.outcome }}"
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/|assets/runtime/" || echo "!! no native libraries / runtimes inside the APK"

      - uses: actions/upload-artifact@v4
        with:
          name: Azux-v5
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            natives.log
            build/natives/*.log
          if-no-files-found: ignore

      # Make a missing engine impossible to overlook: the APK is still uploaded above, but the run turns red.
      - name: Fail if the engine or Java runtime is missing
        if: always() && (steps.natives.outcome == 'failure' || steps.runtime.outcome == 'failure')
        run: |
          echo "::error::The game engine is incomplete in this APK. Natives: ${{ steps.natives.outcome }}, Java runtimes: ${{ steps.runtime.outcome }}. Open the build-logs artifact and the step logs."
          exit 1
