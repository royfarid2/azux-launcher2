plugins {
    id 'com.android.application'
}

android {
    namespace 'com.azux.engine'
    compileSdk 34

    defaultConfig {
        applicationId 'com.azux.engine'
        minSdk 26
        targetSdk 28          // keeps dlopen() from the app's data dir allowed
        versionCode 1
        versionName '0.1-stage1'
        ndk { abiFilters 'arm64-v8a' }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }

    androidResources {
        noCompress 'zip', 'jar'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}
