plugins {
    id 'com.android.application'
}

android {
    namespace 'com.azux.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.azux.launcher'
        minSdk 26
        // 28 on purpose: apps targeting 29+ may not execute binaries from their own storage,
        // and the Azux engine has to run the Java runtime from there.
        targetSdk 28
        versionCode 17
        versionName 'v5'
        ndk { abiFilters 'arm64-v8a' }
        // Fallback when the Java archives are not inside the APK: GitHub Release "runtime" of this repository (set by CI)
        def repo = System.getenv('GITHUB_REPOSITORY') ?: ''
        buildConfigField 'String', 'RUNTIME_BASE', repo ? "\"https://github.com/${repo}/releases/download/runtime/\"" : '""'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Native libraries (libazuxengine, LWJGL, gl4es, OpenAL) are built by tools/build_natives.sh with the
    // NDK and dropped into src/main/jniLibs/arm64-v8a, so Gradle itself needs no NDK or CMake.
    // They must exist as real files: the JVM and LWJGL dlopen them by path.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // the runtime archives are already compressed
    androidResources {
        noCompress += ['gz']
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
